# Reference-solution project. Separate from dbt_practice on purpose.
#
# dbt resource names are unique per PROJECT, not per directory, so the reference
# solution cannot live beside Neil's models under the same project — two
# stg_d1_customers.sql would fail to parse. A second project lets the generated
# reference run under its own original names, with zero edits to the generated code.
#
# Its own DuckDB file (practice_ref.duckdb, via the dbt_practice_ref profile) keeps
# the two runs from overwriting each other's relations.
#
# Day blocks below must mirror dbt_practice/dbt_project.yml exactly — the reference
# solution is generated against the materializations stated in the problem file.
name: dbt_practice_ref
version: '1.0.0'
profile: dbt_practice_ref

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_practice_ref:
    day1:
      staging:
        +materialized: view
      marts:
        +materialized: table
    day2:
      staging:
        +materialized: view
      marts:
        +materialized: table
    # Mirrors dbt_practice/dbt_project.yml exactly. Day 3 is about materialization
    # config; a drift here would change what the reference run proves.
    day3:
      +materialized: view
      marts:
        +materialized: table

    day4:
      staging:
        +materialized: view
      marts:
        +materialized: table

    # Day 5 is about incremental models. The mart is configured as `table` here on
    # purpose — the problem requires it to be incremental, and where that override
    # lives is part of the exercise. Do not change this block.
    day5:
      staging:
        +materialized: view
      marts:
        +materialized: table

    # Day 6 is about late-arriving data. Materialization is a PROJECT concern here —
    # the mart is declared incremental below, so no in-model +materialized is needed.
    # unique_key / incremental_strategy / on_schema_change are MODEL concerns and are
    # not set here on purpose. Mirrors dbt_practice/dbt_project.yml exactly.
    day6:
      staging:
        +materialized: view
      marts:
        +materialized: incremental

seeds:
  dbt_practice_ref:
    +quote_columns: false
