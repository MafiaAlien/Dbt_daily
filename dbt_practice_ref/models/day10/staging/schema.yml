version: 2

models:
  - name: stg_d10_orders
    description: One row per order.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null
      - name: merchant_id
        data_tests:
          - not_null
      - name: ordered_at
        data_tests:
          - not_null

  - name: stg_d10_payments
    description: One row per payment attempt. payment_method is lower-cased and may be null.
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_d10_orders')
              field: order_id
      - name: payment_method
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              values: ['captured', 'failed']
      - name: amount_usd
        data_tests:
          - not_null
      - name: paid_at
