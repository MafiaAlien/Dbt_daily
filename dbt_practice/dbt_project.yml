name: 'dbt_practice'
version: '1.0.0'
profile: 'dbt_practice'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_practice:
    day1:
      staging:
        +materialized: view
      marts:
        +materialized: table
    day2:
      staging:
        +materialized: view
      marts:
        +materialized: table
    # Day 3 is about materialization config itself. This block is deliberately NOT a
    # complete specification of the day — read days/day3/problem.md for what each model
    # must be, and work out which lever gets you there.
    day3:
      +materialized: view
      marts:
        +materialized: table

    day4:
      staging:
        +materialized: view
      marts:
        +materialized: table

    # Day 5 is about incremental models. The mart is configured as `table` here on
    # purpose — the problem requires it to be incremental, and where that override
    # lives is part of the exercise. Do not change this block.
    day5:
      staging:
        +materialized: view
      marts:
        +materialized: table

seeds:
  dbt_practice:
    +quote_columns: false
