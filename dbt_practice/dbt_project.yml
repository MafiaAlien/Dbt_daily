name: 'dbt_practice'
version: '1.0.0'
profile: 'dbt_practice'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_practice:
    day1:
      staging:
        +materialized: view
      marts:
        +materialized: table
    day2:
      staging:
        +materialized: view
      marts:
        +materialized: table
    # Day 3 is about materialization config itself. This block is deliberately NOT a
    # complete specification of the day — read days/day3/problem.md for what each model
    # must be, and work out which lever gets you there.
    day3:
      +materialized: view
      marts:
        +materialized: table

    day4:
      staging:
        +materialized: view
      marts:
        +materialized: table

    # Day 5 is about incremental models. The mart is configured as `table` here on
    # purpose — the problem requires it to be incremental, and where that override
    # lives is part of the exercise. Do not change this block.
    day5:
      staging:
        +materialized: view
      marts:
        +materialized: table

    # Day 6 is about late-arriving data. Materialization is a PROJECT concern here —
    # the mart is declared incremental below, so no in-model +materialized is needed.
    # unique_key / incremental_strategy / on_schema_change are MODEL concerns and are
    # not set here on purpose. Do not change this block.
    day6:
      staging:
        +materialized: view
      marts:
        +materialized: incremental

    # Day 7 is about snapshots and SCD2. Only staging and marts are declared here.
    # `intermediate/` has no entry on purpose — it falls through to dbt's own default.
    # The SNAPSHOT is configured nowhere in this file: strategy, unique_key and
    # updated_at are the exercise and belong in the snapshot's own YAML. Do not
    # change this block.
    day7:
      staging:
        +materialized: view
      marts:
        +materialized: table

    # Day 8 is about snapshot change detection, hard deletes, and a current-view
    # dimension built on top of a snapshot. The SNAPSHOT is configured nowhere
    # in this file: strategy, unique_key, check_cols / updated_at and hard_deletes are
    # the exercise and belong in the snapshot's own YAML. Do not change this block.
    day8:
      staging:
        +materialized: view
      intermediate:
        +materialized: view
      marts:
        +materialized: table

seeds:
  dbt_practice:
    +quote_columns: false
    
