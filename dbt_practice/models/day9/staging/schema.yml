version: 2

models:
  - name: stg_d9_customers
    columns:
      - name: customer_id
        data_tests:
          - not_null 
          - unique 

      - name: customer_name
        data_tests:
          - not_null

      - name: plan_code 
        data_tests:
          - not_null
          - accepted_values:
              arguments: 
                values: ['STARTER', 'GROWTH', 'SCALE']
      
      - name: updated_at
        data_tests:
          - not_null

  - name: stg_d9_invoices
    columns:
      - name: invoice_id 
        data_tests:
          - not_null
          - unique

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments: 
                field: customer_id
                to: ref('stg_d9_customers')
     
      - name: invoiced_at
        data_tests:
          - not_null

  - name: stg_d9_invoice_lines
    columns:
      - name: line_id
        data_tests:
          - not_null
          - unique

      - name: line_type
        data_tests:
          - accepted_values:
              arguments: 
                values: ['SUBSCRIPTION', 'USAGE', 'SEATS']

      - name: invoice_id 
        data_tests:
          - not_null
          - relationships:
              arguments: 
                field: invoice_id
                to: ref('stg_d9_invoices')
      
      - name: amount_usd
        data_tests:
          - not_null

  - name: stg_d9_payments
    columns:
      - name: payment_id
        data_tests:
          - not_null
          - unique

      - name: invoice_id
        data_tests:
          - not_null
          - relationships:
              arguments: 
                field: invoice_id
                to: ref('stg_d9_invoices')

      - name: paid_at
        data_tests:
          - not_null

      - name: amount_usd
        data_tests:
          - not_null

