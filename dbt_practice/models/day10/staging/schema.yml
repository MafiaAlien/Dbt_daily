version: 2

models:
  - name: stg_d10_orders
    description: >
      raw orders data 
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: merchant_id
        data_tests:
          - not_null     
      - name: ordered_at
        data_tests:
          - not_null
  
  - name: stg_d10_payments
    description:  >
      raw payments data 
    columns:
      - name: payment_id
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments: 
                field: order_id
                to: ref('stg_d10_orders')
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments: 
                values: ['captured', 'failed']
      - name: amount_usd
        data_tests:
          - not_null