sources:
  - name: erp
    schema: main
    description: 'raw data from upstream ERP system'
    tables:
      - name: orders 
        identifier: raw_d2_orders
        description: 'raw orders data'
        config: 
          loaded_at_field: exported_at
          freshness: 
            warn_after: 
              count: 12
              period: hour 
            error_after: 
              count: 24
              period: hour
        columns:
          - name: order_id
            description: 'unique id for each orders'
            data_tests:
              - not_null
          -  name: exported_at
             description: 'ts of data loaded'
             data_tests:
               - not_null